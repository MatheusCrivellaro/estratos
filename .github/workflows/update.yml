name: Atualizar feed

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch.py
      - name: Commit dos dados
        run: |
          git config user.name "estratos-bot"
          git config user.email "actions@github.com"
          git add data/articles.json
          git diff --cached --quiet || git commit -m "Atualiza feed"
          git push
      # O push acima dispara o webhook do Netlify, que publica o site.
