<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estratos</title>
  <meta name="description" content="Feed de artigos e descobertas acadêmicas sobre a Bíblia e o cristianismo: arqueologia, manuscritos, história e teologia.">
  <script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2324408E'/><path d='M7 10h18M7 16h18M7 22h18' stroke='%23F3F3EF' stroke-width='2.5'/></svg>">
</head>
<body>

<div class="page">

<aside class="side">
  <a class="wordmark" href="./">Estratos</a>
  <svg class="strata" viewBox="0 0 240 36" aria-hidden="true" preserveAspectRatio="none">
    <path d="M0 5 C60 1 120 10 240 5" />
    <path d="M0 14 C80 19 160 9 240 15" />
    <path d="M0 23 C50 18 130 28 240 22" class="accent" />
    <path d="M0 31 C90 35 170 27 240 32" />
  </svg>
  <p class="tagline">O que a pesquisa acadêmica está descobrindo sobre a Bíblia e o cristianismo, reunido em um só lugar.</p>

  <nav aria-label="Temas">
    <ul class="topics" id="topics">
      <li><button data-topic="" aria-current="true"><span>Tudo</span><span class="n" data-count=""></span></button></li>
      <li><button data-topic="arqueologia"><span><i class="dot arqueologia"></i>Arqueologia</span><span class="n" data-count="arqueologia"></span></button></li>
      <li><button data-topic="manuscritos"><span><i class="dot manuscritos"></i>Manuscritos</span><span class="n" data-count="manuscritos"></span></button></li>
      <li><button data-topic="historia"><span><i class="dot historia"></i>História</span><span class="n" data-count="historia"></span></button></li>
      <li><button data-topic="teologia"><span><i class="dot teologia"></i>Teologia</span><span class="n" data-count="teologia"></span></button></li>
      <li><button data-topic="ciencia"><span><i class="dot ciencia"></i>Ciência</span><span class="n" data-count="ciencia"></span></button></li>
    </ul>
  </nav>

  <div class="tools">
    <input class="search" id="search" type="search" placeholder="Buscar título, autor ou fonte" aria-label="Buscar no feed">
    <label class="peer-toggle"><input type="checkbox" id="peer"><span>Só revisados por pares</span></label>
  </div>

  <div class="side-foot">
    <p class="status" id="status">Carregando o feed…</p>
    <details>
      <summary>Fontes</summary>
      <p class="sources" id="sources"></p>
    </details>
    <button class="theme" id="theme" type="button">Tema escuro</button>
  </div>
</aside>

<main class="main">
  <section class="lead" id="lead" hidden></section>
  <div class="feed" id="feed" aria-live="polite"></div>
  <p class="more-wrap"><button class="more" id="more" hidden>Mostrar mais</button></p>
  <footer class="foot">
    <p>Atualizado automaticamente. Os artigos pertencem a seus autores e editoras; aqui ficam apenas o título, o resumo e o link.</p>
  </footer>
</main>

</div>

<script src="app.js"></script>
</body>
</html>
